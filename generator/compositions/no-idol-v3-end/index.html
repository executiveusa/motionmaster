<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IT;src:url(./fonts/InterTight.ttf);font-weight:100 900}
html,body{margin:0;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:IT,sans-serif}
#bg{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.9) 80%)}
.t{position:absolute;left:0;width:1080px;text-align:center;text-transform:uppercase;letter-spacing:.3em;text-indent:.3em}
#h{top:190px;font-size:76px;font-weight:800;color:#f2ede4}
#h2{top:290px;font-size:76px;font-weight:800;color:#e0b25a}
#p{top:1500px;font-size:44px;font-weight:600;color:#f2ede4}
#pr{top:1570px;font-size:120px;font-weight:800;color:#e0b25a;letter-spacing:.06em;text-indent:.06em}
#u{top:1740px;font-size:36px;font-weight:500;color:#f2ede4;letter-spacing:.45em;text-indent:.45em}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <img id="bg" src="./assets/bg.jpg">
  <div id="shade"></div>
  <div id="h" class="t">No Idol.</div><div id="h2" class="t">No Rival.</div>
  <div id="p" class="t">Postatees Puffer</div>
  <div id="pr" class="t">$240</div>
  <div id="u" class="t">postatees.com</div>
  <audio id="dp" src="./assets/deep.mp3" data-start="0" data-duration="3"></audio>
</div>
<script src="./gsap-3.14.2.min.js"></script>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo("#bg",{scale:1.08},{scale:1,duration:3,ease:"power1.out"},0);
const up=(s,t)=>tl.fromTo(s,{opacity:0,y:24,filter:"blur(10px)"},{opacity:1,y:0,filter:"blur(0px)",duration:.5,ease:"power3.out"},t);
tl.set(["#h","#h2","#p","#pr","#u"],{opacity:0},0);
up("#h",.15);up("#h2",.45);up("#p",.9);up("#pr",1.15);up("#u",1.5);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
