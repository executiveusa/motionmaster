<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(./fonts/Anton-Regular.ttf)}
html,body{margin:0;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Anton,sans-serif}
#grid{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr)}
#grid img{width:100%;height:100%;object-fit:cover;filter:contrast(1.2) saturate(1.3)}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.25) 30%,rgba(0,0,0,.2) 55%,rgba(0,0,0,.95) 82%)}
.w{position:absolute;left:0;width:1080px;text-align:center;text-transform:uppercase;line-height:.92}
#h1{top:150px;font-size:170px;color:#fff;letter-spacing:3px}
#h2{top:310px;font-size:170px;color:#f5c518;letter-spacing:3px}
#prod{top:1340px;font-size:96px;color:#fff;letter-spacing:6px}
#price{top:1455px;font-size:200px;color:#f5c518}
#url{top:1700px;font-size:64px;color:#fff;letter-spacing:10px}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
  <div id="grid">
    <img id="g1" src="./assets/c2.jpg"><img id="g2" src="./assets/c1.jpg">
    <img id="g3" src="./assets/c5.jpg"><img id="g4" src="./assets/c3.jpg">
    <img id="g5" src="./assets/c6.jpg"><img id="g6" src="./assets/c4.jpg">
  </div>
  <div id="shade"></div>
  <div id="h1" class="w">No Idol.</div>
  <div id="h2" class="w">No Rival.</div>
  <div id="prod" class="w">Postatees Puffer</div>
  <div id="price" class="w">$240</div>
  <div id="url" class="w">postatees.com</div>
  <div id="flash"></div>
  <audio id="hit" src="./assets/hit.mp3" data-start="0" data-duration="2.6"></audio>
</div>
<script src="./gsap-3.14.2.min.js"></script>
<script>
const tl=gsap.timeline({paused:true});
tl.fromTo("#flash",{opacity:.9},{opacity:0,duration:.18},0);
tl.fromTo("#grid img",{scale:1.25,opacity:.4},{scale:1,opacity:1,duration:.5,stagger:.06,ease:"power3.out"},0);
tl.to("#grid",{scale:1.06,duration:2.6,ease:"none"},0);
tl.fromTo("#h1",{scale:1.4,opacity:0},{scale:1,opacity:1,duration:.18,ease:"power4.out"},0);
tl.fromTo("#h2",{scale:1.4,opacity:0},{scale:1,opacity:1,duration:.18,ease:"power4.out"},.32);
tl.fromTo("#prod",{y:60,opacity:0},{y:0,opacity:1,duration:.3,ease:"power3.out"},.64);
tl.fromTo("#price",{scale:1.6,opacity:0},{scale:1,opacity:1,duration:.2,ease:"power4.out"},.95);
tl.to("#flash",{opacity:.7,duration:.02},.95).to("#flash",{opacity:0,duration:.12},.98);
tl.fromTo("#url",{y:40,opacity:0},{y:0,opacity:1,duration:.3,ease:"power3.out"},1.27);
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
